<!doctype html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.springframework.org/security/tags">

<head th:replace="fragments/head :: head"></head>
<body>
	<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
	<div th:replace="fragments/help :: help"></div>
	<div class="container-fluid px-3 px-md-4 my-2">
	    <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-2 mb-2 gap-2">
	        <div>
	            <h2 class="fs-3 mb-0">Tableau de bord</h2>
	        </div>
			<div class="d-flex align-items-center gap-2">
				<form th:action="@{/{ctx}/dashboard/{view}(ctx=${eContext}, view=${dashboardView})}" method="get" class="d-flex align-items-center gap-3">
					<div th:if="${role eq 'isSuperAdmin'}" class="d-flex align-items-center gap-2">
						<select id="contextKey" name="contextKey" class="slimSelectClass" required="required"
							onchange="this.form.submit()">
							<option value="">Tous les contextes</option>
							<option th:each="contexte : ${contexts}" th:value="${contexte}" th:text="${contexte}"
								th:selected="${contexte eq currentCtx}">
							</option>
						</select>
					</div>
					<div class="form-check form-switch">
						<input type="hidden" name="dashboardFilterSubmitted" value="true">
						<input class="form-check-input" type="checkbox" role="switch" id="mesSessions" name="mesSessions" value="true"
							th:checked="${mesSessions}" onchange="this.form.submit()">
						<label class="form-check-label" for="mesSessions">
							Mes sessions
						</label>
					</div>
				</form>
			</div>
	    </div>
	
		<ul class="nav nav-tabs mb-3 dashboard-tabs">
			<li class="nav-item">
				<a class="nav-link" th:classappend="${dashboardView eq 'today'} ? 'active'"
				th:href="${role eq 'isSuperAdmin'}
				       ? @{/{ctx}/dashboard(
				             ctx=${eContext},
				             contextKey=${contextKey},
				             mesSessions=${mesSessions})}
				       : @{/{ctx}/dashboard(
				             ctx=${eContext},
				             mesSessions=${mesSessions})}">
					<i class="fa-solid fa-calendar-day me-1"></i>
					<span class="tab-label">Aujourd'hui</span>
				</a>
			</li>
			<li class="nav-item" th:if="${isAdmin or isManager or isSupervisor}">
				<a class="nav-link"
				   th:classappend="${dashboardView eq 'week'} ? 'active'"
				   th:href="${role eq 'isSuperAdmin'}
				       ? @{/{ctx}/dashboard/week(
				             ctx=${eContext},
				             contextKey=${contextKey},
				             mesSessions=${mesSessions})}
				       : @{/{ctx}/dashboard/week(
				             ctx=${eContext},
				             mesSessions=${mesSessions})}">

				    <i class="fa-solid fa-calendar-week me-1"></i>
				    <span class="tab-label">Semaine</span>
				</a>
			</li>
			<li class="nav-item" th:if="${isAdmin or isManager or isSupervisor}">
				<a class="nav-link" th:classappend="${dashboardView == 'month'} ? 'active'"
				th:href="${role eq 'isSuperAdmin'}
				    ? @{/{ctx}/dashboard/month(
				          ctx=${eContext},
				          contextKey=${contextKey},
				          mesSessions=${mesSessions})}
				    : @{/{ctx}/dashboard/month(
				          ctx=${eContext},
				          mesSessions=${mesSessions})}">
				<i class="fa-solid fa-calendar me-1"></i>
					Mois
				</a>
			</li>
			<li class="nav-item" th:if="${isAdmin or isManager or isSupervisor}">
				<a class="nav-link" th:classappend="${dashboardView == 'year'} ? 'active'" 
				th:href="${role eq 'isSuperAdmin'}
				    ? @{/{ctx}/dashboard/year(
				          ctx=${eContext},
				          contextKey=${contextKey},
				          mesSessions=${mesSessions})}
				    : @{/{ctx}/dashboard/year(
				          ctx=${eContext},
				          mesSessions=${mesSessions})}">
					<i class="fa-solid fa-chart-column me-1"></i>
					<span class="tab-label">Année</span>
				</a>
			</li>
		</ul>
	
		<div  id="dashboardTabsContent">
		    <div id="dashboard-content">
				<th:block th:if="${dashboardView == 'today'}">
					<div th:replace="home/inc_today :: inc_today">
					</div>
				</th:block>
				<th:block th:if="${dashboardView == 'week'}">
					<div th:replace="home/inc_week :: inc_week">
					</div>
				</th:block>
				<th:block th:if="${dashboardView == 'month'}">
					<div th:replace="home/inc_month :: inc_month">
					</div>
				</th:block>
				<th:block th:if="${dashboardView == 'year'}">
					<div th:replace="home/inc_year :: inc_year">
					</div>
				</th:block>
		    </div>
		</div>
	</div>

	<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
