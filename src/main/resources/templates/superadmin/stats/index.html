<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/security/tags">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Statistiques</h2>
				<div class="d-flex align-items-center gap-2">
					<select id="anneeUnivSelect" name="anneeUniv" class="slimSelectClass">
						<option th:each="year, iStat : ${years}" th:value="${#strings.substringBefore(year,'/')}" th:text="${year}"
							th:selected="${#strings.substringBefore(year,'/')==currentAnneeUniv}"></option>
					</select>
				</div>
			</div>         	
			<div id="statsSuperAdminCharts" class="mt-3">
				<div class="row gx-4 gy-3">
					<div class="col-lg-4 col-md-6">
						<div class="card h-100 border-0 border-top border-3 border-secondary shadow-sm rounded-3">
							<div class="card-header bg-body-tertiary">
								<h3 class="h6 fw-semibold mb-0 text-secondary-emphasis" th:text="${#strings.capitalize('__#{'stats.superadmin.' + countTagChecksByContext}__')}"></h3>
							</div>
							<div class="card-body">
								<div class="position-relative d-flex justify-content-center align-items-center" style="height: 260px;">
									<canvas id="countTagChecksByContext"></canvas>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-4 col-md-6">
						<div class="card h-100 border-0 border-top border-3 border-secondary shadow-sm rounded-3">
							<div class="card-header bg-body-tertiary">
								<h3 class="h6 fw-semibold mb-0 text-secondary-emphasis" th:text="${#strings.capitalize('__#{'stats.superadmin.' + countSessionsParMoisByContext}__')}"></h3>
							</div>
							<div class="card-body">
								<div class="position-relative d-flex justify-content-center align-items-center" style="height: 260px;">
									<canvas id="countSessionsParMoisByContext"></canvas>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-4 col-md-6">
						<div class="card h-100 border-0 border-top border-3 border-secondary shadow-sm rounded-3">
							<div class="card-header bg-body-tertiary">
								<h3 class="h6 fw-semibold mb-0 text-secondary-emphasis" th:text="${#strings.capitalize('__#{'stats.superadmin.' + countBadgeagesParMoisByContext}__')}"></h3>
							</div>
							<div class="card-body">
								<div class="position-relative d-flex justify-content-center align-items-center" style="height: 260px;">
									<canvas id="countBadgeagesParMoisByContext"></canvas>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-4 col-md-6">
						<div class="card h-100 border-0 border-top border-3 border-secondary shadow-sm rounded-3">
							<div class="card-header bg-body-tertiary">
								<h3 class="h6 fw-semibold mb-0 text-secondary-emphasis" th:text="${#strings.capitalize('__#{'stats.superadmin.' + countSessionEpreuveByTypeByContext}__')}"></h3>
							</div>
							<div class="card-body">
								<div class="position-relative d-flex justify-content-center align-items-center" style="height: 260px;">
									<canvas id="countSessionEpreuveByTypeByContext"></canvas>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-4 col-md-6">
						<div class="card h-100 border-0 border-top border-3 border-secondary shadow-sm rounded-3">
							<div class="card-header bg-body-tertiary">
								<h3 class="h6 fw-semibold mb-0 text-secondary-emphasis" th:text="${#strings.capitalize('__#{'stats.superadmin.' + countTagChecksByTypeEmargementByContext}__')}"></h3>
							</div>
							<div class="card-body">
								<div class="position-relative d-flex justify-content-center align-items-center" style="height: 260px;">
									<canvas id="countTagChecksByTypeEmargementByContext"></canvas>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-4 col-md-6">
						<div class="card h-100 border-0 border-top border-3 border-secondary shadow-sm rounded-3">
							<div class="card-header bg-body-tertiary">
								<h3 class="h6 fw-semibold mb-0 text-secondary-emphasis" th:text="${#strings.capitalize('__#{'stats.superadmin.' + sessionEpreuvesByContext}__')}"></h3>
							</div>
							<div class="card-body">
								<div class="position-relative d-flex justify-content-center align-items-center" style="height: 260px;">
									<canvas id="sessionEpreuvesByContext"></canvas>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
