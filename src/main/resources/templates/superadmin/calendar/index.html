<!doctype html>

	<head th:replace="fragments/head :: head"></head>

		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">

				<div class="d-flex align-items-center gap-2">
					<form th:action="@{/{ctx}/manager/calendar(ctx=${eContext})}">
						<select class="slimSelectClass" id="viewCalendar" name="view" title="Choisir évènements">
							<option value="">-TOUT-</option>
							<option th:each="ctx : ${ctxs}" th:value="${ctx.id}" th:text="${ctx.key}"></option>
						</select>
					</form>
				</div>
			</div>
			<div class="col-lg-12">
				<div id='calendarAll'></div>
			</div>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
