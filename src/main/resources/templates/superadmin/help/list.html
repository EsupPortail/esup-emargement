<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sd="http://www.thymeleaf.org/spring-data">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Aide</h2>
			</div>			
			<div  class="alert alert-danger" th:if="${error}">Une rubrique d'aide avec cette clé existe déjà</div>
			<div class="alert alert-danger" th:if="${not #lists.isEmpty(checkHelp)}" >Les rubriques d'aide ne sont pas à jour, il manque : <span class="font-weight-bold" th:text="${checkHelp}"></span>
				<a th:href="@{/{ctx}/superadmin/help/updateHelps(ctx=${eContext})}" class="btn btn-warning ms-3">Mettre à jour</a>		
			</div>
			<div class="alert alert-info" th:if="${#ctx.containsVariable('nbUpdate')}"><span class="font-weight-bold" th:text="${nbUpdate + ' '}"></span>rubrique(s) d'aide ajoutée(s)</div>
			<table class="table table-hover table-striped table-bordered">
				<thead class="sticky-top">
					<tr>
						<th scope="col">
							<a class="sorted" sd:pagination-sort="key">Clé</a>
						</th>
						<th scope="col">
							<a class="sorted" sd:pagination-sort="title">Titre</a>
						</th>
						<th scope="col" class="d-none d-lg-table-cell">
							<a class="sorted" sd:pagination-sort="description">Description</a>
						</th>
						<th scope="col" class="d-none d-xl-table-cell">
							Intro
						</th>
						<th scope="col" class="d-none d-xl-table-cell">
							Actions
						</th>
						<th scope="col" class="d-none d-xl-table-cell">
							À retenir
						</th>
						<th scope="col" class="d-none d-xl-table-cell">
							Attention
						</th>
						<th scope="col" class="center">
							Version
						</th>
						<th class="center" scope="col">
							Actions
						</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="help : ${helpPage}">
						<td th:text="${help.key}"></td>
						<td th:text="${help.title}"></td>
						<td class="d-none d-lg-table-cell"
						    th:text="${help.description}">
						</td>
						<td class="d-none d-xl-table-cell">
							<span th:if="${help.intro != null and !help.intro.isBlank()}"
							      th:text="${help.intro}">
							</span>
						</td>
						<td class="d-none d-xl-table-cell">
							<span th:if="${help.actions != null and !help.actions.isBlank()}"
							      th:text="${help.actions}">
							</span>
						</td>
						<td class="d-none d-xl-table-cell">
							<span th:if="${help.important != null and !help.important.isBlank()}"
							      th:text="${help.important}">
							</span>
						</td>
						<td class="d-none d-xl-table-cell">
							<span th:if="${help.warning != null and !help.warning.isBlank()}"
							      th:text="${help.warning}">
							</span>
						</td>
						<td class="text-center">
							<span th:text="${help.version}"></span>
						</td>
						<td class="text-center">
							<a class="dropdown-item" th:href="@{/{ctx}/superadmin/help/{id}(id=${help.id},ctx=${eContext})}">
								<i class="fa-solid fa-eye me-2 text-primary"></i>
							</a>
						</td>
					</tr>
				</tbody>
			</table>
			<nav th:replace="fragments/pagination :: pagination"></nav>
			</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
