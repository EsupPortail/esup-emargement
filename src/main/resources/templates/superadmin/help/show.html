<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Aide</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/all/superadmin/help}" class="btn btn-info"
						title="Contextes"><i class="fa fa-home fa-lg"></i></a>
				</div>				
			</div>
			<dl class="row">
	            <dt class="col-sm-2">Clé</dt>
	            <dd class="col-sm-10" th:text="${help.key}"></dd>
	            <dt class="col-sm-2">Valeur</dt>
	            <dd class="col-sm-10" th:text="${help.value}"></dd>			   
	            <dt class="col-sm-2">Description</dt>
	            <dd class="col-sm-10" th:text="${help.description}"></dd>	             
			</dl>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
