<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2" id="createSuperAdminPage">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Ajouter un agent</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/all/superadmin/admins}" class="btn btn-info"
						title="Contextes"><i class="fa fa-home fa-lg"></i></a>
				</div>
			</div>
	    	<div  class="alert alert-danger" th:if="${error}">L'agent avec l'eppn <span class="font-weight-bold" th:text="${user.eppn}"></span> existe déjà pour le contexte <span class="font-weight-bold" th:text="${user.context.key}"></span></div>
			<form action="#" th:action="@{/{ctx}/superadmin/admins/create(ctx=${eContext})}" th:object="${userApp}" method="post"
				id="searchSuperAdmin" class="mt-3">
				<div class="row mb-3">
					<label for="eppn" class="col-lg-2 form-label">Eppn</label>
					<div class="col-lg-10">
						<input name="eppn" class="form-control searchBox" th:hx-get="@{|/${eContext}/superadmin/search-users|}"
							type="email" hx-trigger="keyup changed" hx-target="#searchResults" hx-indicator=".htmx-indicator"
							autocomplete="off"
							placeholder="Ici, recherche sur Nom Prénom --- Manuellement : identifiant@univ-ville.fr">
						<div id="searchResults"></div>
						<div class="htmx-indicator"><span class="visually-hidden">Loading...</span></div>
					</div>
				</div>
				<div class="row mb-3">
					<label for="userRole" class="col-lg-2 form-label">Rôle</label>
					<div class="col-lg-10">
						<select th:field="*{userRole}" class="form-control" required="required">
							<option th:each="role : ${allRoles}" th:value="${role}"
								th:text="#{${'role.' + #strings.toLowerCase(role)}}"></option>
						</select>
					</div>
				</div>
				<div class="row mb-3">
					<label for="context.key" class="col-lg-2 form-label">Contexte</label>
					<div class="col-lg-10">
						<select th:field="*{context.key}" class="slimSelectClass" required="required">
							<option th:each="context : ${contexts}" th:value="${context.key}" th:text="${context.key}"></option>
						</select>
					</div>
				</div>
				<div class="row">
					<div class="col-md-6 mt-5">
						<input type="submit" class="btn btn-success" value="Valider">
					</div>
				</div>
			</form>
        </div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
