<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Ajouter un contexte</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/all/superadmin/context}" class="btn btn-info"
						title="Contextes"><i class="fa fa-home fa-lg"></i></a>
				</div>
			</div>
	    	<div  class="alert alert-danger" th:if="${error}">Le contexte avec le nom  <strong><span th:text="${item}"></span></strong> existe déjà!!</div>
            <form action="#" th:action="@{/{ctx}/superadmin/context/create(ctx=${eContext})}" th:object="${context}" method="post">
            	<div class="row mb-3">
                    <label for="contextUrl" class="col-lg-2 form-label">Clé</label>
                    <div class="col-lg-10">
                        <input type="text" th:field="*{key}" class="form-control" placeholder="Pas d'espace et en minuscule" required="required">
                    </div>
                </div>
            	<div class="row mb-3">
                    <label for="title" class="col-lg-2 form-label">Titre</label>
                    <div class="col-lg-10">
                        <input type="text" th:field="*{title}" class="form-control" required="required">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="commentaire" class="col-lg-2 form-label">Commentaire</label>
                    <div class="col-lg-10">
                       <textarea th:field="*{commentaire}" class="form-control"></textarea>
                    </div>
                </div>
                <div class="row mb-3">
					<label class="col-lg-2 form-check-label"  th:for="${isActif}">
				        Actif
				    </label>
					<div class="col-lg-10">
						 <div class="form-check form-switch">
						      <input class="form-check-input" type="checkbox" th:field="*{isActif}" checked="checked">
						</div>
				    </div>
				</div>
                <div class="row">
                    <div class="col-md-6 mt-5">
                        <input type="submit" class="btn btn-success" value="Valider">
                    </div>
                </div>                  
            </form>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
