<div th:fragment="help" class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasHelp"
	aria-labelledby="offcanvasHelpLabel">

	<div class="offcanvas-header border-bottom bg-light px-4">
		<div>
			<h4 class="offcanvas-title mb-0" id="offcanvasHelpLabel">
				<i class="fa-solid fa-circle-question text-primary me-2"></i>
				Aide
			</h4>
			<h6 class="mb-0 mt-1 fw-semibold" th:if="${help != null and help.title != null and !help.title.isBlank()}"
				th:text="${help.title}">
				Titre de l'aide
			</h6>
			<div th:if="${help != null and help.description != null and !help.description.isBlank()}"
				class="small text-muted mt-1" th:text="${help.description}">
				Description
			</div>
		</div>
		<div class="d-flex align-items-center gap-2 ms-auto">
			<a class="btn btn-sm btn-outline-primary"
				href="https://www.esup-portail.org/wiki/spaces/EMARGEMENT/pages/838107146/Documentation+fonctionnelle"
				target="_blank" title="Documentation fonctionnelle">
				<i class="fa-solid fa-book-open"></i>
			</a>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fermer">
			</button>
		</div>
	</div>

	<div class="offcanvas-body px-4">
		<div class="help-content border-start border-4 border-primary bg-light rounded-end-3 p-3">
			<th:block th:if="${help == null}">
                <p class="mb-0">
                    Aucune aide disponible pour cette page.
                </p>
			</th:block>
			<!-- Introduction -->
			<div th:if="${help != null and help.intro != null and !help.intro.isBlank()}" class="mb-4">
				<p class="mb-0" th:text="${help.intro}">
				</p>
			</div>
			<div th:if="${help != null and help.actionsList != null and not #lists.isEmpty(help.actionsList)}"
				class="mb-4">
				<h5 class="help-section-title">
					<i class="fa-solid fa-list-check text-primary me-2"></i>
					Actions possibles
				</h5>
				<ul class="mb-0 ps-4">
					<li th:each="action : ${help.actionsList}" th:text="${action}" class="mb-2">
					</li>
				</ul>
			</div>
			<!-- À retenir -->
			<div th:if="${help != null and help.importantList != null and not #lists.isEmpty(help.importantList)}"
			     class="help-box help-tip mb-4">
				<div class="fw-semibold mb-2">
					<i class="fa-solid fa-circle-info me-2"></i>
					À retenir
				</div>
				<ul class="mb-0 ps-4">
					<li th:each="item : ${help.importantList}"
						th:text="${item}"
						class="mb-2">
					</li>
				</ul>
			</div>
			<!-- Attention -->
			<div th:if="${help!=null and help.warning != null and !help.warning.isBlank()}"
				class="help-box help-warning mb-4">
				<div class="fw-semibold mb-1">
					<i class="fa-solid fa-triangle-exclamation me-2"></i>
					Attention
				</div>
				<div th:text="${help.warning}">
				</div>
			</div>
		</div>
	</div>
</div>
