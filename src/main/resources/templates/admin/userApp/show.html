<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Agent</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/admin/userApp(ctx=${eContext})}" class="btn btn-info"
						title="Agents"><i class="fa fa-home fa-lg"></i></a>
				</div>				
			</div>			
			<dl class="row">
	            <dt class="col-sm-2">Eppn</dt>
	            <dd class="col-sm-10" th:text="${userApp.eppn}"></dd>
	            <dt class="col-sm-2">Nom</dt>
	            <dd class="col-sm-10" th:text="${userApp.nom}"></dd>			            
	            <dt class="col-sm-2">Prénom</dt>
	            <dd class="col-sm-10" th:text="${userApp.prenom}"></dd>
	            <dt class="col-sm-2">Rôle</dt>
	            <dd class="col-sm-10" th:text="${userApp.userRole}"></dd>
				<dt class="col-sm-2">Spécialité</dt>
				<dd class="col-sm-10" th:text="${userApp.speciality}"></dd>				
	            <dt class="col-sm-2">Date de création</dt>
	            <dd class="col-sm-10" th:text="${#dates.format(userApp.dateCreation, 'dd-MM-yyyy')}"></dd>   
	            <dt class="col-sm-2">Dernière connexion</dt>
	            <dd class="col-sm-10" th:text="${#dates.format(userApp.lastConnexion, 'dd-MM-yyyy HH:mm')}"></dd>
			</dl>
		</div>		
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
