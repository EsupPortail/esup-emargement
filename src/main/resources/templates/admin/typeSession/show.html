<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Type de session</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/admin/typeSession(ctx=${eContext})}" class="btn btn-info"
						title="Types de session"><i class="fa-solid fa-home fa-lg"></i></a>
				</div>				
			</div>
			<dl class="row">
	            <dt class="col-sm-2">Code</dt>
	            <dd class="col-sm-10" th:text="${typeSession.key}"></dd>
	            <dt class="col-sm-2">Libellé</dt>
	            <dd class="col-sm-10" th:text="${typeSession.libelle}"></dd>			   
	            <dt class="col-sm-2">Commentaire</dt>
	            <dd class="col-sm-10" th:text="${typeSession.comment}"></dd>
	            <dt class="col-sm-2">Date de modification</dt>
	            <dd class="col-sm-10" th:text="${#dates.format(typeSession.dateModification, 'dd-MM-yyyy')}"></dd>
	            <dt class="col-sm-2">Natif</dt>
	            <dd class="col-sm-10"><i th:class="${typeSession.addByAdmin} ? 'fa-solid fa-check text-success' :'fa-solid fa-times text-danger'"></i></dd>
			</dl>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
