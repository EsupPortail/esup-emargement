<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Modifier un type de session</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/admin/typeSession(ctx=${eContext})}" class="btn btn-info"
						title="Types de session"><i class="fa-solid fa-home fa-lg"></i></a>
				</div>				
			</div>			
	    	<div  class="alert alert-danger" th:if="${error}">Un type de session avec ce code  <strong><span th:text="${nom}"></span></strong> existe déjà!!</div>
            <form action="#" th:action="@{/{ctx}/admin/typeSession/update/{id}(ctx=${eContext}, id=${typeSession.id})}" th:object="${typeSession}" method="post" id="typeSessionForm">
				<div class="row mb-3">
                	<label for="key" class="col-lg-2 form-label">Code</label>
                	<div class="col-lg-10">
						<input type="text"  th:field="*{key}" class="form-control" readonly="readonly" required="required">
					</div>
				</div>
				<div class="row mb-3">
                	<label for="key" class="col-lg-2 form-label">Libellé</label>
                	<div class="col-lg-10">
						<input type="text"  th:field="*{libelle}" class="form-control" required="required">
					</div>
				</div>
				<div class="row mb-3">
                	<label for="comment" class="col-lg-2 form-label">Commentaire</label>
                	<div class="col-lg-10">
						<textarea class='form-control'  th:field="*{comment}"></textarea>
					</div>
				</div>
				<input type="hidden" th:field="*{addByAdmin}">
				<div class="row">
                    <div class="col-md-6 mt-5">
                        <input type="submit" class="btn btn-success" value="Valider">
                        </div>
                 </div>                  
            </form>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
