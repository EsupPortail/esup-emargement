<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Ajouter un lieu</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/admin/location(ctx=${eContext})}" class="btn btn-info"
						title="Lieux"><i class="fa-solid fa-home fa-lg"></i></a>
				</div>				
			</div>			
		    <div  class="alert alert-danger" th:if="${error}">Le lieu avec le nom  <strong><span th:text="${nom}"></span></strong> existe déjà!!</div>
            <form action="#" th:action="@{/{ctx}/admin/location/create(ctx=${eContext})}" th:object="${location}" method="post" enctype="multipart/form-data" >
                <div class="row mb-3">
               		<div class="col-lg-2">
                		<label for="nom" class="form-label">Nom</label>
                	</div>
                	<div class="col-lg-10">
						<input type="text" th:field="*{nom}" class="form-control" required="required">
					</div>
				</div>
                <div class="row mb-3">
               		<div class="col-lg-2">
                		<label for="adresse" class="form-label">Adresse</label>
                	</div>
                	<div class="col-lg-10">
						<textarea  th:field="*{adresse}" class="form-control"></textarea>
					</div>
				</div>
                <div class="row mb-3">
               		<div class="col-lg-2">
                		<label for="capacite" class="form-label">Capacité maximale</label>
                	</div>
                	<div class="col-lg-10">
						 <input type="number" min="1" th:field="*{capacite}" class="form-control" required="required">
					</div>
				</div>
				<div class="row mb-3">
               		<div class="col-lg-2">
                		<label for="campus" class="form-label">Site</label>
                	</div>
                	<div class="col-lg-10">
						<select th:field="*{campus}" class="slimSelectClass" required="required">
							<option th:each="campus : ${allCampuses}"
								th:value="${campus.id}" th:text="${campus.site}"></option>
						</select>
					</div>
				</div>
                <div class="row">
                    <div class="col-md-6 mt-5">
                        <input type="submit" class="btn btn-success" value="Valider">
                    </div>
                </div>                  
            </form>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
