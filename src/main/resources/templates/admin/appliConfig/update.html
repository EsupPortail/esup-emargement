<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Modifier une configuration</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/admin/appliConfig(ctx=${eContext})}" class="btn btn-info"
						title="Configurations"><i class="fa-solid fa-home fa-lg"></i></a>
				</div>				
			</div>
            <form action="#" th:action="@{/{ctx}/admin/appliConfig/update/{id}(ctx=${eContext}, id=${appliConfig.id})}" th:object="${appliConfig}" method="post" id="configForm">
                <div class="row mb-3">
                    <label for="key" class="col-lg-2 form-label">Catégorie</label>
                    <div class="col-lg-10">
                     	<input type="text"  class="form-control" th:value="${appliConfig.category}" disabled="disabled">
                    </div>
                </div>
                <div class="row mb-3">
                	<label for="key" class="col-lg-2 form-label">Clé</label>
                	<div class="col-lg-10">
						 <input type="text" th:field="*{key}" class="form-control" required="required" readonly="readonly">
					</div>
				</div>
				<div class="row mb-3">
					<label for="type" class="col-lg-2 form-label">Type</label>
					<div class="col-lg-10">
						<label class="radio-inline">
							<input type="radio" name="type" id="typeText" value="TEXT" th:checked="${checked=='TEXT'}"
								disabled="disabled" /> Texte
						</label>
						<label class="radio-inline">
							<input type="radio" name="type" id="typeHtml" value="HTML" th:checked="${checked=='HTML'}"
								disabled="disabled" /> Html
						</label>
						<label class="radio-inline">
							<input type="radio" name="type" id="typeBoolean" value="BOOLEAN" th:checked="${checked=='BOOLEAN'}"
								disabled="disabled" /> Booléen
						</label>
					</div>
				</div>
				<div class="row mb-3">
				    <div class="col-lg-2">
				        <label for="valeur" class="col-lg-2 form-label">Valeur</label>
				    </div>
					<div class="col-lg-10">
				    	<div th:replace="admin/appliConfig/appliConfigValueField :: valueField(${appliConfig.type}, ${appliConfig.value})"></div>
					</div>
				</div>
				<div class="row mb-3">
                		<label for="description" class="col-lg-2 form-label">Description</label>
                	<div class="col-lg-10">
						<textarea  th:field="*{description}" class="form-control" ></textarea>
					</div>
				</div>	
                 <input type="hidden" id="hiddenValeur" th:value="${appliConfig.value}"/>
                <div class="row">
                    <div class="col-md-6 mt-5">
                        <input type="submit" class="btn btn-success" value="Valider">
                    </div>
                </div>                  
            </form>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
