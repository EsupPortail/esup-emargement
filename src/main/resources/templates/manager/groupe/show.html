<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Groupe</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/manager/groupe(ctx=${eContext})}" class="btn btn-info" title="Groupes"><i
							class="fa fa-home fa-lg"></i></a>
				</div>
			</div>
			<dl class="row">
	            <dt class="col-sm-2">Nom</dt>
	            <dd class="col-sm-10" th:text="${groupe.nom}"></dd>
	            <dt class="col-sm-2">Description</dt>
	            <dd class="col-sm-10" th:text="${groupe.description}"></dd>
	            <dt class="col-sm-2">Membres</dt>
	            <dd class="col-sm-10" th:text="${groupe.nbTagCheck}"></dd>
	            <dt class="col-sm-2">Date de création</dt>
	            <dd class="col-sm-10"  th:text="${#dates.format(groupe.dateCreation, 'dd-MM-yyyy')}"></dd>
	            <dt class="col-sm-2">Date de modification</dt>
	            <dd class="col-sm-10"  th:text="${#dates.format(groupe.dateModification, 'dd-MM-yyyy')}"></dd>			            
	            <dt class="col-sm-2">Modificateur</dt>
	            <dd class="col-sm-10" th:text="${groupe.modificateur}"></dd> 		            
			</dl>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
