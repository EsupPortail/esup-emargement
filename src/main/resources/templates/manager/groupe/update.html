<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Modifier un groupe</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/manager/groupe(ctx=${eContext})}" class="btn btn-info"
											title="Groupes"><i class="fa fa-home fa-lg"></i></a>				</div>				
			</div>
            <form action="#" th:action="@{/{ctx}/manager/groupe/update/{id}(ctx=${eContext}, id=${groupe.id})}" th:object="${groupe}" method="post">
            	<div class="row mb-3">
                    <label for="nom" class="col-lg-2 form-label">Nom</label>
                    <div class="col-lg-10">
                        <input type="text" th:field="*{nom}" class="form-control" required="required">
                    </div>
                </div>
            	<div class="row mb-3">
                    <label for="description" class="col-lg-2 form-label">Description</label>
                    <div class="col-lg-10">
                        <input type="text" th:field="*{description}" class="form-control" required="required">
                    </div>
                </div>
				<div class="row mb-3">
                    <label for="anneeUniv" class="col-lg-2 form-label">Année</label>
                    <div class="col-lg-10">
                        <input type="text" th:field="*{anneeUniv}" class="form-control" required="required">
                    </div>
                </div>	                    
                <div class="row">
                    <div class="col-md-6 mt-5">
                        <input type="submit" class="btn btn-success" value="Valider">
                    </div>
                </div> 	                    
             </form>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
