<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2" >
			<div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2" th:with="se=${sessionLocation.sessionEpreuve}">
				<div>
					<h2 class="fs-3 mb-1">Lieu de session</h2>
					<small class="text-muted fs-5" th:text="${se.nomSessionEpreuve + ' le ' + #dates.format(se.dateExamen, 'dd-MM-yyyy') +
					#dates.format(se.heureEpreuve, ' HH:mm') +  #dates.format(se.finEpreuve, '  - HH:mm') + ' à ' + se.campus.site}"></small>
					<small class="text-muted h5" th:if="${se.dateFin != null}" th:text="${' - Fin le ' + #dates.format(se.dateFin, 'dd-MM-yyyy')}"></small>
					<span class="font-weight-bold text-danger" th:text="${se.statutSession.key eq 'CLOSED'} ? ' -- Session cloturée'"></span>	
				</div>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/manager/sessionLocation/sessionEpreuve/{id}(ctx=${eContext}, id=${se.id})}" class="btn btn-info"
						title="Lieux de session"><i class="fa fa-home fa-lg"></i></a>
				</div>			
			</div>
			<dl class="row">
	            <dt class="col-sm-2">Lieu</dt>
	            <dd class="col-sm-10" th:text="${sessionLocation.location.nom}"></dd>
	            <dt class="col-sm-2">Priorité</dt>
	            <dd class="col-sm-10" th:text="${sessionLocation.priorite}"></dd>   
	            <dt class="col-sm-2">Temps aménagé</dt>
	            <dd class="col-sm-10"><i th:class="${sessionLocation.isTiersTempsOnly} ? 'fa fa-check text-success' :'fa fa-times text-danger'"></i></dd> 
	            <dt class="col-sm-2">Capacité</dt>
	            <dd class="col-sm-10" th:text="${sessionLocation.capacite}"></dd>
			</dl>
		</div>		
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
