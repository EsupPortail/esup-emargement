<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div class="container-fluid px-3 px-md-4 my-2" th:with="declaration=${absence.origine.name() == 'ETUDIANT' and absence.statutValidation.name() != 'VALIDEE'}">
			<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2 mb-3">
				<h2 class="fs-3 mb-0">Modifier une absence</h2>
				<div class="d-flex align-items-center gap-2">
					<a th:href="${declaration} ? @{/{ctx}/manager/absence/declarations(ctx=${eContext},statut=${absence.statutValidation.name()})} : @{/{ctx}/manager/absence(ctx=${eContext})}" class="btn btn-info" title="Motifs d'absence"><i
							class="fa-solid fa-home fa-lg"></i></a>
				</div>				
			</div>
			<div th:if="${successMessage}"
			     class="alert alert-success alert-dismissible fade show"
			     role="alert">
			    <span>La pièce jointe a bien été supprimée.</span>
			    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
			</div>	
			<div class="alert alert-info">Si les dates de cette absence ne sont pas bonnes, vous devez supprimer cette absence et en créer une nouvelle.</div>
            <form action="#" th:action="@{/{ctx}/manager/absence/update/{id}(ctx=${eContext},id=${absence.id})}" th:object="${absence}" method="post" enctype="multipart/form-data">
				<div class="row mb-3">
					<label for="motifAbsence" class="col-lg-2 form-label">Type</label>
					<div class="col-lg-10">
						<select th:field="*{motifAbsence}" required="required">
						<option value="">----Choisir----</option>
							<option th:each="motif : ${motifAbsences}"
								th:value="${motif.id}" th:text="${motif.libelle + ' [' + motif.typeAbsence + ' - ' + motif.statutAbsence +'] '}"></option>
						</select>
					</div>
				</div>
                 <div class="row mb-3">
                    <label for="eppn"  class="col-lg-2 form-label">Personne</label>
                    <div class="col-lg-10">
						<input type="disabled"class="form-control" th:value="${nomPrenom}" disabled/>
						<input type="hidden" name="person" th:value="${absence.person.id}" />
                    </div>
                </div>
                <div class="row mb-3">
					<label for="dateExamen" class="col-lg-2 form-label">Date de début</label>
                    <div class="col-lg-10">
                        <input type="date"  id="strDateDebut" placeholder="dd/MM/YYYY" name="strDateDebut" class="form-control"
                        th:value="${#dates.format(absence.dateDebut, 'yyyy-MM-dd')}" required="required" disabled>
                    </div>
                </div>
                <div class="row mb-3">		                    
                    <label for="dateExamen" class="col-lg-2 form-label">Date de fin</label>
                    <div class="col-lg-10">
                    	<input type="date" placeholder="dd/MM/YYYY" name="strDateFin" class="form-control"
                        	th:value="${#dates.format(absence.dateFin, 'yyyy-MM-dd')}" disabled>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="heureDebut" class="col-lg-2 form-label">Heure de début</label>
                   	<div class="col-lg-10">
                        <input type="time" th:field="*{heureDebut}" class="form-control" id="heureDebut"
                        	required="required" disabled>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="finEpreuve" class="col-lg-2 form-label">Heure de fin</label>
                    <div class="col-lg-10">
                    	<input type="time" th:field="*{heureFin}" class="form-control" id="heureFin"
                    		required="required" disabled>
                    </div>
                </div>	                    
                <div class="row mb-3">
                    <label for="file" class="col-lg-2 form-label">Pièces jointes</label>
                    <div class="col-lg-10">
						<div class="mb-3" th:if="${attachments != null and !attachments.isEmpty()}">
							<label class="form-label">Pièces jointes existantes</label>
							<div class="list-group">
								<div th:each="pj : ${attachments}" class="list-group-item d-flex align-items-center gap-3">
									<!-- Icône selon le type -->
									<i class="fa-solid fs-3" th:classappend="${
									       pj.contentType == 'application/pdf'
									           ? ' fa-file-pdf text-danger'
									       : #strings.startsWith(pj.contentType, 'image/')
									           ? ' fa-file-image text-success'
									       : pj.contentType == 'application/msword'
									           or pj.contentType == 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
									           ? ' fa-file-word text-primary'
									       : pj.contentType == 'application/vnd.ms-excel'
									           or pj.contentType == 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
									           ? ' fa-file-excel text-success'
										   : pj.contentType == 'text/csv'
										             or pj.contentType == 'application/csv'
										             ? ' fa-file-csv text-success'
									       : pj.contentType == 'text/plain'
									           ? ' fa-file-lines text-secondary'
									       : ' fa-file text-secondary'
									   }" aria-hidden="true">
									</i>
									<!-- Nom et taille -->
									<div class="flex-grow-1 min-width-0">
										<a th:href="@{/pieces-jointes/{id}(id=${pj.id})}" th:text="${pj.filename}"
											class="text-decoration-none text-break">
										</a>
										<div class="small text-secondary"
										     th:text="${pj.fileSize < 1048576
										         ? #numbers.formatDecimal(pj.fileSize / 1024.0, 1, 1) + ' Ko'
										         : #numbers.formatDecimal(pj.fileSize / 1048576.0, 1, 1) + ' Mo'}">
										</div>
									</div>
									<!-- Télécharger -->
									<a th:href="@{/{ctx}/supervisor/storedFile/{id}/photo(id=${pj.id},ctx=${eContext})}"
										class="btn btn-outline-secondary btn-sm" title="Télécharger" target="_blank" aria-label="Télécharger">
										<i class="fa-solid fa-download"></i>
									</a>
									<button type="submit"
									      th:formaction="@{/{ctx}/manager/absence/storedFile/delete/{id}(ctx=${eContext}, id=${pj.id})}"
									      formmethod="post"
									      formnovalidate
									      class="btn btn-outline-danger btn-sm"
									      title="Supprimer la pièce jointe"
									      aria-label="Supprimer la pièce jointe"
									      onclick="return confirm('Supprimer cette pièce jointe ?');">
									  <i class="fa-solid fa-trash" aria-hidden="true"></i>
									</button>
								</div>
							</div>
						</div>	
						<input type="file" class="filepond" id="inputFilePond" name="files" multiple data-allow-reorder="true"
							data-max-file-size="3MB" data-max-files="3">
	 				</div>
				</div>
                <div class="row mb-3">
                    <label for="comment" class="col-lg-2 form-label">Commentaire</label>
                    <div class="col-lg-10">
                    	<textarea th:field="*{commentaire}" class="form-control"></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mt-5">
                        <input type="submit" class="btn btn-success" value="Valider" th:value="${declaration} ? 'Enregistrer les modifications' : 'Valider'">
                    </div>
                </div>
            </form>
		</div>
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
