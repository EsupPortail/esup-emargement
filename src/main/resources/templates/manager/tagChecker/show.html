<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head th:replace="fragments/head :: head"></head>
	<body>
		<nav th:replace="fragments/menu :: menu(activeMenu)"></nav>
		<div th:replace="fragments/help :: help"></div>
		<div class="container-fluid px-3 px-md-4 my-2">
			<div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2"
			     th:with="se=${tagChecker.sessionLocation.sessionEpreuve}">
			    <!-- Partie gauche -->
			    <div>
			        <h2 class="fs-3 mb-1" th:text="${surveillantTerme + 's'}"></h2>
			        <small class="text-muted fs-5">
			            <span th:text="${se.nomSessionEpreuve + ' le '
			                + #dates.format(se.dateExamen, 'dd-MM-yyyy')
			                + #dates.format(se.heureEpreuve, ' HH:mm')
			                + #dates.format(se.finEpreuve, ' - HH:mm')
			                + ' à ' + se.campus.site}">
			            </span>
			            <span th:if="${se.dateFin != null}"
			                  th:text="${' -- Fin le ' + #dates.format(se.dateFin, 'dd-MM-yyyy')}">
			            </span>
			        </small>
			        <span class="font-weight-bold text-danger"
			              th:if="${se.statutSession.key eq 'CLOSED'}"
			              th:text="' -- Session clôturée'">
			        </span>
			    </div>
				<div class="d-flex align-items-center gap-2">
					<a th:href="@{/{ctx}/manager/tagChecker/sessionEpreuve/{id}(ctx=${eContext}, id=${se.id})}" class="btn btn-info"
						title="Surveillants"><i class="fa fa-home fa-lg"></i></a>
				</div>				
			</div>		
			<dl class="row">
	            <dt class="col-sm-2">Lieu de Session</dt>
	            <dd class="col-sm-10" th:text="${tagChecker.sessionLocation.location.nom}"></dd>
				<dt class="col-sm-2">Personne</dt>
				<dd class="col-sm-10" th:text="${tagChecker.userApp.nom + ' ' + tagChecker.userApp.prenom}"></dd>
	            <dt class="col-sm-2">Eppn</dt>
	            <dd class="col-sm-10" th:text="${tagChecker.userApp.eppn}"></dd>
			</dl>
		</div>		
		<footer th:replace="fragments/footer :: footer"></footer>
	</body>
</html>
